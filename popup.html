<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WhatsApp翻译无忧</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="app-brand">
          <span class="brand-logo" aria-hidden="true"><img src="assets/logos/whatsapp.svg" alt=""></span>
          <h1>WhatsApp翻译无忧</h1>
        </div>
        <span id="saveStatus"></span>
        <div class="header-actions">
          <button class="icon-btn ghost" type="button" title="设置">⚙</button>
          <button class="icon-btn ghost" type="button" title="更多">⋮</button>
        </div>
      </header>

      <section class="panel-card panel-main">
        <div class="section-block switch-block">
          <label class="switch-row switch-lg">
            <input id="enabled" type="checkbox">
            <span class="switch-text">
              <strong>翻译开关</strong>
              <small>开启后自动翻译消息内容</small>
            </span>
          </label>
        </div>

        <div class="section-block section-divider">
          <div class="section-head">
            <h2>翻译引擎</h2>
            <div class="section-head-actions">
              <button id="openDiagLog" class="link-button" type="button">日志</button>
              <button id="openEngineSettings" class="link-button" type="button">引擎设置</button>
            </div>
          </div>
          <div class="provider-picker">
            <span id="providerLogoMain" class="provider-picker-logo" aria-hidden="true"></span>
            <span id="providerNameMain" class="provider-picker-name">谷歌翻译</span>
            <span id="providerBadgeMain" class="provider-picker-badge">（推荐）</span>
            <span class="provider-picker-arrow" aria-hidden="true">⌄</span>
            <select id="provider" aria-label="翻译引擎"></select>
          </div>
        </div>

        <div class="section-block dual-grid section-divider">
          <label>
            收到消息翻译成
            <select id="receiveLanguage"></select>
          </label>
          <label>
            发送消息翻译成
            <select id="sendLanguage"></select>
          </label>
        </div>

        <div class="section-block check-list section-divider">
          <label class="switch-row">
            <input id="autoDetectLanguage" type="checkbox">
            <span>智能识别联系人语言</span>
            <span class="info-dot" title="自动检测对方语言，优化发送翻译">i</span>
          </label>
          <label class="switch-row">
            <input id="autoReceive" type="checkbox">
            <span>自动翻译双方消息</span>
            <span class="info-dot" title="收到和发送消息都自动显示译文">i</span>
          </label>
        </div>

        <fieldset class="section-block section-divider">
          <legend>发送翻译方式</legend>
          <label class="radio-row">
            <input name="sendTrigger" type="radio" value="enter">
            <span>
              回车翻译
              <small>首次 Enter 翻译，再次 Enter 发送</small>
            </span>
          </label>
          <label class="radio-row">
            <input name="sendTrigger" type="radio" value="typing">
            <span>
              输入时翻译
              <small>输入内容实时翻译</small>
            </span>
          </label>
        </fieldset>

        <section class="section-block section-divider">
          <label class="switch-row">
            <input id="sendAfterTranslate" type="checkbox">
            <span>翻译完成后直接发送</span>
          </label>
          <p class="hint">按 Enter 或点击发送时生效；关闭后先填入译文供检查。输入法选词不会触发。</p>
        </section>
        <details class="ai-settings">
          <summary>AI 助手与翻译要求</summary>
          <p id="aiProviderStatus" role="status"></p>
          <p class="hint">聊天工具栏中的“AI 助手”支持建议回复和润色。仅使用已启用且配置完整的 AI 引擎；Google、微软和 DeepL 不提供生成能力。</p>
          <label for="translationPrompt">AI 翻译要求</label>
          <textarea id="translationPrompt" rows="3" maxlength="1000" placeholder="例如：使用礼貌、简洁的商务语气；保留产品型号和数字。"></textarea>
          <p class="hint">仅对 AI 引擎生效。客户语言、地区和常用语可在聊天输入框上方设置。</p>
        </details>

        <label class="switch-row section-block section-divider">
          <input id="forbidChinese" type="checkbox">
          <span>禁止中文直接发送</span>
          <span class="info-dot" title="发送前必须先翻译">i</span>
        </label>

        <section class="section-block section-divider">
          <h2>译文样式</h2>
          <div class="style-grid">
            <label>
              译文颜色
              <div class="color-select-wrap">
                <input id="translationColor" type="color" value="#8e24aa">
              </div>
            </label>
            <label>
              字体大小
              <select id="translationSize">
                <option value="small">小</option>
                <option value="default">默认</option>
                <option value="large">大</option>
                <option value="xlarge">特大</option>
              </select>
            </label>
          </div>
        </section>

        <button id="save" type="button" class="save-main-btn">💾 保存设置</button>
        <p id="status" role="status"></p>
      </section>
    </main>

    <div id="engineModal" class="modal" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="engineTitle">
        <div class="modal-head">
          <h2 id="engineTitle">引擎设置</h2>
          <button id="closeEngineSettings" class="icon-btn ghost" type="button" title="关闭">✕</button>
        </div>
        <p class="hint">支持拖拽排序。排序越靠前，优先级越高；失败后会按顺序自动切换备用引擎。</p>
        <div id="providerList" class="provider-list"></div>
        <div class="modal-actions">
          <button id="cancelEngineSettings" class="plain-button" type="button">取消</button>
          <button id="saveEngineSettings" class="save-button" type="button">保存</button>
        </div>
      </div>
    </div>

    <div id="diagModal" class="modal" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="diagTitle">
        <div class="modal-head">
          <h2 id="diagTitle">日志 / 诊断</h2>
          <button id="closeDiagLog" class="icon-btn ghost" type="button" title="关闭">✕</button>
        </div>
        <p class="hint">只保留最近约 400 条。不含原文和 API Key。复制全部按时间从早到晚。</p>
        <div class="diag-toolbar">
          <label for="diagLevel">级别
            <select id="diagLevel" aria-label="日志级别">
              <option value="all">全部</option>
              <option value="error">错误</option>
              <option value="warn">警告</option>
              <option value="info">信息</option>
            </select>
          </label>
          <button id="copyDiagLog" class="plain-button" type="button">复制全部</button>
          <button id="clearDiagLog" class="plain-button" type="button">清空</button>
        </div>
        <p id="diagStatus" class="hint" role="status"></p>
        <ol id="diagList" class="diag-list"></ol>
      </div>
    </div>

    <template id="providerTemplate">
      <article class="provider-card">
        <div class="provider-head">
          <button class="drag-handle" type="button" title="拖拽排序">⋮⋮</button>
          <div class="provider-title">
            <span class="provider-icon" aria-hidden="true">●</span>
            <strong></strong>
            <span class="provider-tag"></span>
          </div>
          <div class="provider-actions">
            <button class="icon-btn settings-provider" type="button" title="设置">⚙</button>
            <button class="icon-btn test-provider" type="button" title="测试接口">✓</button>
            <label class="prefer-switch" title="首选">
              <input class="provider-preferred" type="checkbox" disabled>
              <span>首选</span>
            </label>
            <label class="mini-switch" title="启用">
              <input class="provider-enabled" type="checkbox">
              <span></span>
            </label>
          </div>
        </div>
        <div class="provider-config" hidden></div>
        <span class="provider-status"></span>
      </article>
    </template>

    <script src="chat-tools.js"></script>
    <script src="diagnostics.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
